services:
  strata:
    image: ghcr.io/sschorer/strata:latest
    # For local development build instead of pulling:
    # build: .
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      # What this server may reach on disk: the mount below. It confines the
      # *Add project* folder picker, what may be registered, and what
      # /analyze will walk. Without it the default is the container user's
      # home, which is empty — and it must never be wider than what is mounted.
      STRATA_ROOTS: "/repos"
      # AI provider (optional) — see .env.example.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      # Mount a repo you want to analyse (read-only) at /repos.
      - ${STRATA_REPOS_DIR:-./repos}:/repos:ro
      # Persist the analysis cache, the project registry and the app settings
      # across restarts.
      # Third-party plugins are read from /app/.strata/plugins, so they live in
      # this volume too — or mount a host directory there instead (see
      # docs/PLUGINS.md).
      - strata-data:/app/.strata
    restart: unless-stopped

volumes:
  strata-data:
