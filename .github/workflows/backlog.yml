name: Backlog → issues

# Manually create GitHub issues from BACKLOG.md. Idempotent: re-running only
# adds items that don't already exist as issues. Run from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only (create nothing)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create issues from backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/backlog-to-issues.mjs
          ${{ inputs.dry-run && '--dry-run' || '' }}
