name: Vouch command

# `/vouch @user` and `/unvouch @user`, usable only by owners, edit the trusted
# reviewer list in .github/vouched.json and commit it to main.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  command:
    if: startsWith(github.event.comment.body, '/vouch') || startsWith(github.event.comment.body, '/unvouch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/vouched.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const owners = (data.owners || []).map((s) => s.toLowerCase());

            const actor = context.payload.comment.user.login.toLowerCase();
            const react = (content) =>
              github.rest.reactions.createForIssueComment({
                ...context.repo,
                comment_id: context.payload.comment.id,
                content,
              });

            if (!owners.includes(actor)) {
              await react('-1');
              return core.setFailed(`@${actor} is not an owner; cannot vouch.`);
            }

            const body = context.payload.comment.body.trim();
            const [cmd, rawUser] = body.split(/\s+/);
            const user = (rawUser || '').replace(/^@/, '');
            if (!user) {
              await react('confused');
              return core.setFailed('Usage: /vouch @user  or  /unvouch @user');
            }

            const set = new Set((data.vouched || []).map((s) => s.toLowerCase()));
            if (cmd === '/vouch') set.add(user.toLowerCase());
            else set.delete(user.toLowerCase());
            data.vouched = [...set].sort();

            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

            const { execSync } = require('child_process');
            execSync('git config user.name "strata-vouch-bot"');
            execSync('git config user.email "actions@github.com"');
            execSync(`git add ${path}`);
            const verb = cmd === '/vouch' ? 'vouch' : 'unvouch';
            execSync(`git commit -m "chore(vouch): ${verb} @${user}"`);
            execSync('git push origin main');

            await react('+1');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body:
                `${cmd === '/vouch' ? '✅ Vouched' : '↩️ Un-vouched'} **@${user}**. ` +
                `Trusted reviewers: ${data.vouched.map((u) => '@' + u).join(', ') || '(none)'}.`,
            });
