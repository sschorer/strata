# CodeRabbit configuration — https://docs.coderabbit.ai/
# Install the CodeRabbit GitHub App on this repo to activate AI PR reviews.
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "packages/sdk/**"
      instructions: >-
        This is the public plugin contract. Flag any breaking change to exported
        types or the define* helpers, and require a version bump + changelog note.
    - path: "plugins/**"
      instructions: >-
        Each plugin must ship a strata.plugin.json whose "sdk" matches the SDK
        major. Check that default export uses the matching define* helper.
    - path: ".github/workflows/**"
      instructions: >-
        Review for least-privilege permissions and pinned action versions.

chat:
  auto_reply: true
